<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="76" viewBox="0 0 1000 76" role="img"><title>Tech Stack</title><style>@font-face{font-family:'RDSerif';font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'RDDisplay';font-weight:800;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'RDArabic';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}

text{font-family:'RDDisplay',Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,34px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,-30px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(2)}}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1300px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.fd{animation:fade 1.2s ease both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spinr 120s linear infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-in-out infinite}
</style><defs><linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9C46A" stop-opacity=".7"/><stop offset="1" stop-color="#E9C46A" stop-opacity="0"/></linearGradient><pattern id="khatam" width="56" height="56" patternUnits="userSpaceOnUse"><g fill="none" stroke="#E9C46A" stroke-opacity=".13" stroke-width="1"><rect x="12" y="12" width="32" height="32"/><rect x="12" y="12" width="32" height="32" transform="rotate(45 28 28)"/><circle cx="28" cy="28" r="2.2" fill="#E9C46A" fill-opacity=".25" stroke="none"/></g></pattern><clipPath id="cl"><rect width="1000" height="76" rx="16"/></clipPath></defs><g clip-path="url(#cl)"><rect width="1000" height="76" rx="16" fill="#0A0E14"/><rect width="1000" height="76" fill="url(#khatam)" opacity=".55"/><rect width="520" height="76" fill="#0A0E14" opacity=".0"/></g><rect x=".5" y=".5" width="999" height="75" rx="16" fill="none" stroke="#243044"/><rect x="0" y="16" width="5" height="44" rx="2.5" fill="#E9C46A"/><text x="34" y="56" font-size="52" fill="#E9C46A" class="up" style="font-family:'RDSerif',Arial,sans-serif;font-weight:400;font-style:italic;"><tspan font-style="italic">03</tspan></text><text x="112" y="49" font-size="30" fill="#F1E8D4" class="up" style="font-family:'RDDisplay',Arial,sans-serif;font-weight:800;animation-delay:0.1s;">Tech Stack</text><rect x="315.14" y="39.4" width="421.2600000000001" height="1.2" fill="url(#hl)"/><g transform="translate(305.14,40)" fill="none" stroke="#E9C46A" stroke-opacity="1" stroke-width="1.4"><rect x="-4.949747468305833" y="-4.949747468305833" width="9.899494936611665" height="9.899494936611665"/><rect x="-4.949747468305833" y="-4.949747468305833" width="9.899494936611665" height="9.899494936611665" transform="rotate(45)"/></g><text x="863.2" y="50" font-size="28" fill="#E9C46A" text-anchor="middle" class="up" style="font-family:'RDArabic',Arial,sans-serif;font-weight:700;animation-delay:0.2s;">التقنيات</text></svg>