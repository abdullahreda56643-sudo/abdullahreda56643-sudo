<svg xmlns="http://www.w3.org/2000/svg" width="480" height="290" viewBox="0 0 480 290" role="img"><title>Wazaef Misr</title><style>@font-face{font-family:'RDSerif';font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'RDMono';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'RDDisplay';font-weight:800;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'RDDisplay';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'RDMono';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}

text{font-family:'RDDisplay',Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,34px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,-30px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(2)}}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1300px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.fd{animation:fade 1.2s ease both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spinr 120s linear infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-in-out infinite}
</style><defs><pattern id="khatam" width="56" height="56" patternUnits="userSpaceOnUse"><g fill="none" stroke="#E9C46A" stroke-opacity=".13" stroke-width="1"><rect x="12" y="12" width="32" height="32"/><rect x="12" y="12" width="32" height="32" transform="rotate(45 28 28)"/><circle cx="28" cy="28" r="2.2" fill="#E9C46A" fill-opacity=".25" stroke="none"/></g></pattern><clipPath id="cl"><rect width="480" height="290" rx="18"/></clipPath><linearGradient id="fadeC" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101722" stop-opacity="0"/><stop offset=".55" stop-color="#101722" stop-opacity="1"/></linearGradient></defs><g clip-path="url(#cl)"><rect width="480" height="290" fill="#101722"/><rect width="480" height="290" fill="url(#khatam)" opacity=".8"/><rect width="480" height="290" fill="url(#fadeC)"/><rect width="5" height="290" fill="#E9C46A"/></g><rect x=".5" y=".5" width="479" height="289" rx="18" fill="none" stroke="#243044"/><text x="454" y="88" font-size="76" fill="#E9C46A" text-anchor="end" opacity="0.9" style="font-family:'RDSerif',Arial,sans-serif;font-weight:400;font-style:italic;"><tspan font-style="italic">01</tspan></text><circle class="dot" cx="32" cy="40" r="4.5" fill="#E9C46A"/><text x="46" y="45" font-size="11.5" fill="#E9C46A" letter-spacing="2.2" style="font-family:'RDMono',Arial,sans-serif;font-weight:600;">LIVE  /  2026</text><text x="30" y="92" font-size="26" fill="#F1E8D4" style="font-family:'RDDisplay',Arial,sans-serif;font-weight:800;">Wazaef Misr</text><text x="30" y="124" font-size="13.5" fill="#9AA7B8" style="font-family:'RDDisplay',Arial,sans-serif;font-weight:500;">Job marketplace for the Egyptian market with 1,200+ listings,</text><text x="30" y="144" font-size="13.5" fill="#9AA7B8" style="font-family:'RDDisplay',Arial,sans-serif;font-weight:500;">role-based dashboards for job seekers, employers and admins,</text><text x="30" y="164" font-size="13.5" fill="#9AA7B8" style="font-family:'RDDisplay',Arial,sans-serif;font-weight:500;">resume parsing and fraud reporting.</text><text x="30" y="216" font-size="12" fill="#E9C46A" letter-spacing="1.6" style="font-family:'RDMono',Arial,sans-serif;font-weight:600;">LARAVEL  /  MYSQL</text><line x1="30" y1="244" x2="450" y2="244" stroke="#243044"/><text x="30" y="270" font-size="12" fill="#F1E8D4" style="font-family:'RDMono',Arial,sans-serif;font-weight:400;">mqala.xyz</text><g stroke="#E9C46A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M434 272 L444 262"/><path d="M435 262 H444 V271"/></g></svg>