<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340"><style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-400}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cyc{0%{opacity:0;transform:translateY(12px)}6%,30%{opacity:1;transform:none}36%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-10px)}}
.f{animation:fade .8s both} .fl{animation:float 4s ease-in-out infinite} .p{animation:pulse 2.4s ease-in-out infinite}
.d{stroke-dasharray:60 340;animation:dash 6s linear infinite} .g{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s .3s both}
.cy{animation:cyc 9s infinite both} .bk{animation:blink 1s infinite} .dr{animation:drift 9s ease-in-out infinite}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b18"/><stop offset=".55" stop-color="#0a1a2f"/><stop offset="1" stop-color="#06222a"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<radialGradient id="g1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".30"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2dd4bf" stroke-opacity=".07"/></pattern>
</defs><rect width="1200" height="340" fill="url(#bg)"/><rect width="1200" height="340" fill="url(#grid)"/>
<circle cx="1030" cy="60" r="300" fill="url(#g1)" class="dr"/><circle cx="160" cy="320" r="280" fill="url(#g2)" class="dr" style="animation-delay:-4s"/>
<g fill="none" stroke="#2dd4bf" stroke-opacity=".35" stroke-width="2"><path d="M0 36H70L100 62H190"/><path d="M0 326H60L90 312H200"/></g>
<g fill="none" stroke="url(#ac)" stroke-width="2.5" stroke-linecap="round"><path class="d" d="M0 36H70L100 62H190"/><path class="d" d="M0 326H60L90 312H200" style="animation-delay:-3s"/></g>
<g class="p" fill="#050b18" stroke="#38bdf8" stroke-width="2"><circle cx="190" cy="62" r="5"/><circle cx="200" cy="312" r="5"/></g>
<text class="m fl" x="560" y="300" font-size="90" font-weight="bold" fill="url(#ac)" fill-opacity=".10">&lt;/&gt;</text>
<g class="f"><text class="m" x="70" y="100" font-size="17" fill="#2dd4bf" letter-spacing="3">&lt;developer /&gt;</text></g>
<g class="f" style="animation-delay:.2s"><text x="70" y="172" font-size="66" font-weight="bold" fill="#fff">Abdullah Reda</text></g>
<g class="cy"><text x="70" y="222" font-size="30" font-weight="bold" fill="url(#ac)">Full-Stack Developer</text></g>
<g class="cy" style="animation-delay:3s"><text x="70" y="222" font-size="30" font-weight="bold" fill="url(#ac)">React · Laravel · MySQL</text></g>
<g class="cy" style="animation-delay:6s"><text x="70" y="222" font-size="26" font-weight="bold" fill="url(#ac)">I replace spreadsheets &amp; manual work</text></g>
<rect class="bk" x="70" y="236" width="14" height="3" fill="#2dd4bf"/>
<g class="f" style="animation-delay:.6s"><rect x="70" y="268" width="150" height="34" rx="17" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".5"/><text x="145" y="290" font-size="14" fill="#a7f3d0" text-anchor="middle">Egypt · Saudi clients</text>
<rect x="232" y="268" width="190" height="34" rx="17" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/><text x="327" y="290" font-size="14" fill="#bae6fd" text-anchor="middle">Open to relocate to KSA</text></g>
<g class="fl"><rect x="780" y="70" width="380" height="222" rx="14" fill="#08142a" stroke="#2dd4bf" stroke-opacity=".4"/>
<rect x="780" y="70" width="380" height="32" rx="14" fill="#0f2038"/><circle cx="800" cy="86" r="5" fill="#f87171"/><circle cx="818" cy="86" r="5" fill="#fbbf24"/><circle cx="836" cy="86" r="5" fill="#34d399"/>
<text class="m" x="1140" y="90" font-size="12" fill="#64748b" text-anchor="end">profile.js</text></g>
<g class="fl"><g class="f" style="animation-delay:1.2s"><text class="m" x="810" y="128" font-size="15"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0">&#160;abdullah</tspan><tspan fill="#94a3b8">&#160;=&#160;{</tspan></text></g><g class="f" style="animation-delay:1.5499999999999998s"><text class="m" x="810" y="156" font-size="15"><tspan fill="#38bdf8">&#160;&#160;stack</tspan><tspan fill="#2dd4bf">:&#160;[&#x27;React&#x27;,&#160;&#x27;Laravel&#x27;,&#160;&#x27;MySQL&#x27;],</tspan></text></g><g class="f" style="animation-delay:1.9s"><text class="m" x="810" y="184" font-size="15"><tspan fill="#38bdf8">&#160;&#160;builds</tspan><tspan fill="#2dd4bf">:&#160;&#x27;real&#160;business&#160;platforms&#x27;,</tspan></text></g><g class="f" style="animation-delay:2.25s"><text class="m" x="810" y="212" font-size="15"><tspan fill="#38bdf8">&#160;&#160;location</tspan><tspan fill="#2dd4bf">:&#160;&#x27;Egypt&#x27;,</tspan></text></g><g class="f" style="animation-delay:2.5999999999999996s"><text class="m" x="810" y="240" font-size="15"><tspan fill="#38bdf8">&#160;&#160;openTo</tspan><tspan fill="#2dd4bf">:&#160;&#x27;KSA&#160;relocation&#x27;,</tspan></text></g><g class="f" style="animation-delay:2.95s"><text class="m" x="810" y="268" font-size="15"><tspan fill="#94a3b8">};</tspan></text></g></g></svg>