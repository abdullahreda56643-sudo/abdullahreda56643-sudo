<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img">
<style>
text{font-family:Inter,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,30px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-25px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.8)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.up{animation:fadeUp .8s ease both}
.fi{animation:fadeIn 1s ease both}
.fl{animation:floaty 6s ease-in-out infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
</style>
<title>Abdullah Reda, Full-Stack Developer</title>
<defs>
<linearGradient id="gName" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="gBar" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity=".07"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
<clipPath id="clip"><rect width="1000" height="320" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1000" height="320" fill="#0B1220"/>
<rect width="1000" height="320" fill="url(#grid)"/>
<g filter="url(#blur)">
<circle cx="860" cy="70" r="130" fill="#38BDF8" fill-opacity=".30" style="animation:drift1 14s ease-in-out infinite"/>
<circle cx="640" cy="290" r="120" fill="#A78BFA" fill-opacity=".26" style="animation:drift2 17s ease-in-out infinite"/>
<circle cx="80" cy="-10" r="100" fill="#38BDF8" fill-opacity=".14" style="animation:drift2 19s ease-in-out infinite"/>
</g>
<rect x="0" y="0" width="1000" height="4" fill="url(#gBar)"/>

<g class="mono" fill="#38BDF8" fill-opacity=".5" font-size="15">
<text class="fl" x="548" y="300" style="animation-delay:0s">&lt;/&gt;</text>
<text class="fl" x="590" y="300" style="animation-delay:1.2s">{ }</text>
<text class="fl" x="540" y="30" style="animation-delay:2.4s">=&gt;</text>
<text class="fl" x="965" y="170" style="animation-delay:3.2s" fill="#A78BFA">;</text>
</g>

<g class="up" style="animation-delay:.1s">
<text class="mono" x="50" y="70" font-size="15" fill="#38BDF8">&gt; hello, world. I'm</text>
</g>
<g class="up" style="animation-delay:.35s">
<text x="48" y="132" font-size="56" font-weight="800" fill="url(#gName)" letter-spacing="-1">Abdullah Reda</text>
</g>
<g class="up" style="animation-delay:.6s">
<text x="50" y="176" font-size="24" font-weight="600" fill="#E6EDF7">Full-Stack Developer</text>
<text x="50" y="206" font-size="16" fill="#8FA3BF">I build web systems that replace manual work.</text>
</g>
<g class="up" style="animation-delay:.85s">
<rect x="50" y="224" width="61" height="28" rx="14" fill="#38BDF8" fill-opacity=".10" stroke="#38BDF8" stroke-opacity=".55"/><text x="80.5" y="242.55" text-anchor="middle" font-size="13" font-weight="600" fill="#38BDF8">React</text><rect x="121" y="224" width="76" height="28" rx="14" fill="#F87171" fill-opacity=".10" stroke="#F87171" stroke-opacity=".55"/><text x="159.0" y="242.55" text-anchor="middle" font-size="13" font-weight="600" fill="#F87171">Laravel</text><rect x="207" y="224" width="61" height="28" rx="14" fill="#FBBF24" fill-opacity=".10" stroke="#FBBF24" stroke-opacity=".55"/><text x="237.5" y="242.55" text-anchor="middle" font-size="13" font-weight="600" fill="#FBBF24">MySQL</text></g>
<g class="up" style="animation-delay:1.1s">
<rect x="50" y="268" width="486" height="30" rx="15" fill="#34D399" fill-opacity=".10" stroke="#34D399" stroke-opacity=".5"/>
<circle class="dot" cx="70" cy="283" r="4.5" fill="#34D399"/>
<text x="84" y="288" font-size="12.5" font-weight="600" fill="#34D399">Available immediately  ·  Cairo, Egypt  ·  Open to relocation to KSA</text>
</g>

<g class="fi" style="animation-delay:.9s">
<rect x="590" y="50" width="370" height="216" rx="14" fill="#0A1426" stroke="#1E2B45"/>
<rect x="590" y="50" width="370" height="34" rx="14" fill="#13213B"/>
<rect x="590" y="70" width="370" height="14" fill="#13213B"/>
<circle cx="612" cy="67" r="5.5" fill="#F87171"/><circle cx="632" cy="67" r="5.5" fill="#FBBF24"/><circle cx="652" cy="67" r="5.5" fill="#34D399"/>
<text class="mono" x="775" y="71" font-size="11" fill="#8FA3BF" text-anchor="middle">profile.js</text>
<g class="mono" font-size="14">
<text x="612" y="112" fill="#A78BFA" class="up" style="animation-delay:1.2s">const <tspan fill="#E6EDF7">abdullah</tspan> <tspan fill="#38BDF8">=</tspan> <tspan fill="#E6EDF7">{</tspan></text>
<text x="632" y="138" class="up" style="animation-delay:1.5s" fill="#8FA3BF">role: <tspan fill="#34D399">"Full-Stack Developer"</tspan>,</text>
<text x="632" y="162" class="up" style="animation-delay:1.8s" fill="#8FA3BF">stack: <tspan fill="#34D399">["React", "Laravel", "MySQL"]</tspan>,</text>
<text x="632" y="186" class="up" style="animation-delay:2.1s" fill="#8FA3BF">markets: <tspan fill="#34D399">["Egypt", "Saudi Arabia"]</tspan>,</text>
<text x="632" y="210" class="up" style="animation-delay:2.4s" fill="#8FA3BF">since: <tspan fill="#FBBF24">2021</tspan>,</text>
<text x="632" y="234" class="up" style="animation-delay:2.7s" fill="#8FA3BF">available: <tspan fill="#FBBF24">true</tspan></text>
<text x="612" y="256" class="up" style="animation-delay:3s" fill="#E6EDF7">};<tspan fill="#38BDF8" style="animation:blink 1s steps(1) infinite"> |</tspan></text>
</g>
</g>
</g>
<rect x=".5" y=".5" width="999" height="319" rx="18" fill="none" stroke="#1E2B45"/>
</svg>