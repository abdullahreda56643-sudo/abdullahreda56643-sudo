<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" role="img"><title>Open to work</title><style>@font-face{font-family:'RDSerif';font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'RDMono';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'RDArabic';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}

text{font-family:'RDDisplay',Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,34px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,-30px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(2)}}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1300px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.fd{animation:fade 1.2s ease both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spinr 120s linear infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-in-out infinite}
</style><defs><pattern id="khatam" width="56" height="56" patternUnits="userSpaceOnUse"><g fill="none" stroke="#E9C46A" stroke-opacity=".13" stroke-width="1"><rect x="12" y="12" width="32" height="32"/><rect x="12" y="12" width="32" height="32" transform="rotate(45 28 28)"/><circle cx="28" cy="28" r="2.2" fill="#E9C46A" fill-opacity=".25" stroke="none"/></g></pattern><radialGradient id="gG"><stop offset="0%" stop-color="#E9C46A" stop-opacity="0.5"/><stop offset="100%" stop-color="#E9C46A" stop-opacity="0"/></radialGradient><radialGradient id="gC"><stop offset="0%" stop-color="#F4845F" stop-opacity="0.45"/><stop offset="100%" stop-color="#F4845F" stop-opacity="0"/></radialGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9C46A"/><stop offset=".5" stop-color="#F4845F"/><stop offset="1" stop-color="#4FD1B5"/></linearGradient><clipPath id="cl"><rect width="1000" height="140" rx="20"/></clipPath></defs><g clip-path="url(#cl)"><rect width="1000" height="140" rx="20" fill="#0A0E14"/><rect width="1000" height="140" fill="url(#khatam)"/><circle cx="120" cy="150" r="170" fill="url(#gG)" style="animation:drift2 14s ease-in-out infinite"/><circle cx="890" cy="-10" r="170" fill="url(#gC)" style="animation:drift1 17s ease-in-out infinite"/><rect y="136" width="1000" height="4" fill="url(#bar)"/></g><rect x=".5" y=".5" width="999" height="139" rx="20" fill="none" stroke="#243044"/><text x="500.0" y="58" font-size="36" fill="#F1E8D4" text-anchor="middle" style="font-family:'RDSerif',Arial,sans-serif;font-weight:400;font-style:italic;"><tspan font-style="italic">Open to junior and mid-level full-stack roles.</tspan></text><text x="500.0" y="88" font-size="11.5" fill="#9AA7B8" text-anchor="middle" letter-spacing="1.8" style="font-family:'RDMono',Arial,sans-serif;font-weight:400;">REMOTE OR ON-SITE  /  AVAILABLE IMMEDIATELY  /  OPEN TO RELOCATION TO SAUDI ARABIA</text><text x="500.0" y="118" font-size="20" fill="#E9C46A" text-anchor="middle" style="font-family:'RDArabic',Arial,sans-serif;font-weight:700;">متاح للعمل فوراً</text></svg>