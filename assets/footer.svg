<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img">
<style>
text{font-family:Inter,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,30px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-25px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.8)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.up{animation:fadeUp .8s ease both}
.fi{animation:fadeIn 1s ease both}
.fl{animation:floaty 6s ease-in-out infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
</style>
<title>Open to work</title>
<defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient><filter id="b"><feGaussianBlur stdDeviation="30"/></filter><clipPath id="c"><rect width="1000" height="110" rx="16"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="1000" height="110" fill="#0B1220"/>
<g filter="url(#b)"><circle cx="120" cy="110" r="80" fill="#38BDF8" fill-opacity=".28" style="animation:drift2 12s ease-in-out infinite"/><circle cx="880" cy="0" r="80" fill="#A78BFA" fill-opacity=".28" style="animation:drift1 15s ease-in-out infinite"/></g>
<rect x="0" y="106" width="1000" height="4" fill="url(#g)"/></g>
<rect x=".5" y=".5" width="999" height="109" rx="16" fill="none" stroke="#1E2B45"/>
<circle class="dot" cx="268.0" cy="44" r="5" fill="#34D399"/>
<text x="500.0" y="50" font-size="19" font-weight="800" fill="#E6EDF7" text-anchor="middle">Open to junior and mid-level full-stack roles</text>
<text class="mono" x="500.0" y="78" font-size="13" fill="#8FA3BF" text-anchor="middle">remote or on-site  ·  available immediately  ·  open to relocation to Saudi Arabia</text>
</svg>