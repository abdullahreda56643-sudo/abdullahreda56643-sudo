<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150"><style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-400}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cyc{0%{opacity:0;transform:translateY(12px)}6%,30%{opacity:1;transform:none}36%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-10px)}}
.f{animation:fade .8s both} .fl{animation:float 4s ease-in-out infinite} .p{animation:pulse 2.4s ease-in-out infinite}
.d{stroke-dasharray:60 340;animation:dash 6s linear infinite} .g{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s .3s both}
.cy{animation:cyc 9s infinite both} .bk{animation:blink 1s infinite} .dr{animation:drift 9s ease-in-out infinite}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b18"/><stop offset=".55" stop-color="#0a1a2f"/><stop offset="1" stop-color="#06222a"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<radialGradient id="g1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".30"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2dd4bf" stroke-opacity=".07"/></pattern>
</defs><g transform="translate(0,0)"><g class="f" style="animation-delay:0.0s"><rect width="235" height="150" rx="14" fill="#0d1f36" stroke="#2dd4bf" stroke-opacity=".25"/><rect class="g" x="0" y="0" width="235" height="4" rx="2" fill="url(#ac)" style="animation-delay:0.3s"/><text x="24" y="70" font-size="46" font-weight="bold" fill="url(#ac)">1,200+</text><text x="24" y="102" font-size="14" fill="#94a3b8">job listings on Wazaef</text><text x="24" y="122" font-size="14" fill="#94a3b8">Misr</text><circle class="p" cx="210" cy="26" r="4" fill="#2dd4bf"/></g></g><g transform="translate(255,0)"><g class="f" style="animation-delay:0.2s"><rect width="235" height="150" rx="14" fill="#0d1f36" stroke="#2dd4bf" stroke-opacity=".25"/><rect class="g" x="0" y="0" width="235" height="4" rx="2" fill="url(#ac)" style="animation-delay:0.5s"/><text x="24" y="70" font-size="46" font-weight="bold" fill="url(#ac)">600+</text><text x="24" y="102" font-size="14" fill="#94a3b8">registered users on</text><text x="24" y="122" font-size="14" fill="#94a3b8">Wazaef Misr</text><circle class="p" cx="210" cy="26" r="4" fill="#2dd4bf"/></g></g><g transform="translate(510,0)"><g class="f" style="animation-delay:0.4s"><rect width="235" height="150" rx="14" fill="#0d1f36" stroke="#2dd4bf" stroke-opacity=".25"/><rect class="g" x="0" y="0" width="235" height="4" rx="2" fill="url(#ac)" style="animation-delay:0.7s"/><text x="24" y="70" font-size="46" font-weight="bold" fill="url(#ac)">2,500</text><text x="24" y="102" font-size="14" fill="#94a3b8">trainee records managed</text><text x="24" y="122" font-size="14" fill="#94a3b8">for a Saudi institute</text><circle class="p" cx="210" cy="26" r="4" fill="#2dd4bf"/></g></g><g transform="translate(765,0)"><g class="f" style="animation-delay:0.6000000000000001s"><rect width="235" height="150" rx="14" fill="#0d1f36" stroke="#2dd4bf" stroke-opacity=".25"/><rect class="g" x="0" y="0" width="235" height="4" rx="2" fill="url(#ac)" style="animation-delay:0.9000000000000001s"/><text x="24" y="70" font-size="46" font-weight="bold" fill="url(#ac)">2</text><text x="24" y="102" font-size="14" fill="#94a3b8">markets served: Egypt</text><text x="24" y="122" font-size="14" fill="#94a3b8">and Saudi Arabia</text><circle class="p" cx="210" cy="26" r="4" fill="#2dd4bf"/></g></g></svg>