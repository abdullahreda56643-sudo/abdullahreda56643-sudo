<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img">
<style>
text{font-family:Inter,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,30px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-25px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.8)}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.up{animation:fadeUp .8s ease both}
.fi{animation:fadeIn 1s ease both}
.fl{animation:floaty 6s ease-in-out infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
</style>
<title>Featured Projects</title>
<defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient><linearGradient id="gl" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient></defs>
<rect width="1000" height="64" rx="14" fill="#0B1220"/>
<rect x=".5" y=".5" width="999" height="63" rx="14" fill="none" stroke="#1E2B45"/>
<rect x="0" y="14" width="5" height="36" rx="2.5" fill="url(#g)"/>
<text class="mono up" x="30" y="40" font-size="14" fill="#38BDF8">02</text>
<text class="up" x="68" y="41" font-size="26" font-weight="800" fill="#E6EDF7" style="animation-delay:.1s">Featured Projects</text>
<text class="mono fi" x="970" y="39" font-size="13" fill="#8FA3BF" text-anchor="end" style="animation-delay:.4s">live platforms and client work</text>
<line x1="330" y1="32" x2="700" y2="32" stroke="url(#gl)" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="900" style="animation:draw 2s ease both"/>
</svg>